name: Docs quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Check this repository's own docs
        run: doccheck README.md --fail-on error --json docs-report.json --markdown docs-report.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-quality-report
          path: |
            docs-report.json
            docs-report.md
