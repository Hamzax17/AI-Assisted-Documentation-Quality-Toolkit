[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-quality-toolkit"
version = "0.1.0"
description = "AI-assisted documentation quality toolkit: link, style, terminology and structure checks with optional LLM rewrites."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
ui = ["streamlit>=1.30"]

[project.scripts]
doccheck = "doctoolkit.cli:main"

[tool.setuptools]
packages = ["doctoolkit"]

[tool.setuptools.package-data]
doctoolkit = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
